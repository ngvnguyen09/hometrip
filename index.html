<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Trip Pay">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">
    <title>Trip Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        input, select, textarea { font-size: 16px !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .modal-bg { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="app" class="max-w-md mx-auto min-h-screen relative pb-28 bg-white shadow-2xl"></div>

    <script>
        let state = {
            trips: JSON.parse(localStorage.getItem('tp_v4')) || [],
            currentTripId: null,
            view: 'home',
            editingExpId: null,
            isEditingTripName: false
        };

        const save = () => {
            localStorage.setItem('tp_v4', JSON.stringify(state.trips));
            render();
        };

        const fmt = (v) => new Intl.NumberFormat('vi-VN').format(v) + 'đ';

        const getNow = () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            return now.toISOString().slice(0, 16);
        };

        const getFriendlyTime = (iso) => {
            const date = new Date(iso);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            
            const fullDate = date.toLocaleDateString('vi-VN') + ' ' + date.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});

            if (diff < 60) return 'Vừa xong';
            if (diff < 3600) return Math.floor(diff/60) + ' phút trước';
            
            const isToday = date.toDateString() === now.toDateString();
            const isYesterday = new Date(now.setDate(now.getDate() - 1)).toDateString() === date.toDateString();
            now.setDate(now.getDate() + 1); 

            let dayLabel = '';
            if (isToday) dayLabel = 'Hôm nay';
            else if (isYesterday) dayLabel = 'Hôm qua';
            else dayLabel = date.toLocaleDateString('vi-VN');

            return `${dayLabel} (${date.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})})`;
        };

        const icon = {
            plus: `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7v14"/></svg>`,
            home: `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>`,
            chart: `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>`,
            trash: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`,
            back: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`,
            edit: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
            note: `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`
        };

        function render() {
            const app = document.getElementById('app');
            const trip = state.trips.find(t => t.id === state.currentTripId);

            if (state.view === 'home') app.innerHTML = viewHome();
            else if (state.view === 'setup') app.innerHTML = viewSetup();
            else if (state.view === 'detail') app.innerHTML = viewDetail(trip);
            else if (state.view === 'summary') app.innerHTML = viewSummary(trip);

            if (state.currentTripId && state.view !== 'home') app.innerHTML += viewNav();
            if (state.editingExpId) app.innerHTML += viewEditModal(trip);
        }

        function viewHome() {
            return `
                <div class="p-6 safe-top">
                    <header class="mb-10 pt-4">
                        <h1 class="text-4xl font-extrabold tracking-tighter italic">Trip Pay</h1>
                        <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest mt-1">Dữ liệu an toàn trên iPhone</p>
                    </header>
                    <button onclick="state.view='setup'; render();" class="w-full bg-blue-600 text-white p-6 rounded-[2.5rem] shadow-xl flex items-center justify-between mb-10 active:scale-95 transition-all">
                        <div class="text-left font-extrabold">
                            <p class="text-xl">Bắt đầu chuyến mới</p>
                            <p class="text-[10px] opacity-70 uppercase tracking-widest">Nhập liệu ngay</p>
                        </div>
                        <div class="bg-white/20 p-3 rounded-full">${icon.plus}</div>
                    </button>
                    <div class="space-y-4">
                        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2">Lịch sử đi chơi</h2>
                        ${state.trips.map(t => `
                            <div onclick="state.currentTripId='${t.id}'; state.view='detail'; render();" class="bg-slate-50 p-5 rounded-3xl flex justify-between items-center active:bg-blue-50">
                                <div class="flex-1 truncate pr-4">
                                    <h3 class="font-bold text-slate-800">${t.name}</h3>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase">${t.families.length} gia đình</p>
                                </div>
                                <div class="text-right shrink-0">
                                    <p class="text-blue-600 font-black">${fmt(t.expenses.reduce((s,e)=>s+e.amount,0))}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function viewSetup() {
            return `
                <div class="p-6 safe-top">
                    <button onclick="state.view='home'; render();" class="mb-8 flex items-center gap-1 text-slate-400 font-bold text-[10px] uppercase tracking-widest">
                        ${icon.back} Quay lại
                    </button>
                    <h2 class="text-3xl font-black mb-8 italic">Thiết lập</h2>
                    <div class="bg-gray-50 p-6 rounded-[2.5rem] space-y-6">
                        <input id="in_name" type="text" placeholder="Tên chuyến đi..." class="w-full p-4 rounded-2xl font-bold border-none shadow-sm">
                        <textarea id="in_fams" rows="3" placeholder="Tên các nhà (cách nhau dấu phẩy)..." class="w-full p-4 rounded-2xl font-bold border-none shadow-sm resize-none"></textarea>
                        <button onclick="handleCreate()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs">Khởi tạo</button>
                    </div>
                </div>
            `;
        }

        function viewDetail(trip) {
            const total = trip.expenses.reduce((s,e) => s + e.amount, 0);
            return `
                <div class="bg-white sticky top-0 z-20 p-6 border-b flex justify-between items-center shadow-sm safe-top">
                    <div class="truncate pr-4 flex-1">
                        ${state.isEditingTripName ? 
                            `<input id="edit_trip_name" type="text" value="${trip.name}" onblur="handleSaveTripName(this.value)" autofocus class="w-full font-extrabold text-xl outline-none text-blue-600">` :
                            `<h2 onclick="state.isEditingTripName=true; render();" class="text-xl font-extrabold truncate flex items-center gap-2">${trip.name} <span class="text-slate-300">${icon.edit}</span></h2>`
                        }
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Tổng chi: ${fmt(total)}</p>
                    </div>
                    <button onclick="handleDelTrip('${trip.id}')" class="text-slate-200 active:text-red-500 p-2">${icon.trash}</button>
                </div>
                <div class="p-4 space-y-6">
                    ${trip.status !== 'completed' ? `
                        <div class="bg-slate-50 p-5 rounded-[2.5rem] space-y-3">
                            <input id="ex_res" type="text" placeholder="Chi cho việc gì..." class="w-full p-4 rounded-xl font-bold shadow-sm border-none">
                            <div class="grid grid-cols-2 gap-3">
                                <input id="ex_amt" type="number" inputmode="numeric" placeholder="Số tiền" class="w-full p-4 rounded-xl font-black text-blue-600 shadow-sm border-none">
                                <select id="ex_pay" class="w-full p-4 rounded-xl font-bold shadow-sm bg-white border-none appearance-none">
                                    ${trip.families.map(f => `<option value="${f}">${f}</option>`).join('')}
                                </select>
                            </div>
                            <input id="ex_time" type="datetime-local" value="${getNow()}" class="w-full p-4 rounded-xl font-bold text-slate-500 shadow-sm border-none">
                            <textarea id="ex_note" placeholder="Ghi chú thêm (không bắt buộc)..." class="w-full p-4 rounded-xl font-bold shadow-sm border-none resize-none" rows="2"></textarea>
                            <button onclick="handleAddEx()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black active:scale-95 transition-all shadow-md uppercase text-xs tracking-widest">Lưu hoạt động</button>
                        </div>
                    ` : ''}

                    <div class="space-y-3">
                        <h3 class="text-[10px] font-black text-slate-400 uppercase px-2 tracking-widest">Hoạt động</h3>
                        ${trip.expenses.map(e => `
                            <div onclick="state.editingExpId='${e.id}'; render();" class="bg-white p-4 rounded-2xl flex flex-col gap-2 shadow-sm border border-gray-100 active:bg-slate-50 transition-all">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center gap-2 truncate">
                                        <div class="bg-blue-50 text-blue-600 px-2 py-1 rounded-lg font-black text-[10px] whitespace-nowrap">${getFriendlyTime(e.time)}</div>
                                        <span class="font-bold text-sm truncate">${e.reason}</span>
                                    </div>
                                    <span class="font-black text-slate-700 shrink-0">${fmt(e.amount)}</span>
                                </div>
                                <div class="flex justify-between items-center text-[10px] font-bold uppercase text-slate-400">
                                    <span>${e.payer}</span>
                                    ${e.note ? `<span class="flex items-center gap-1 text-blue-400 lowercase italic">${icon.note} ${e.note}</span>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function viewEditModal(trip) {
            const exp = trip.expenses.find(e => e.id === state.editingExpId);
            return `
                <div class="fixed inset-0 z-50 modal-bg flex items-end">
                    <div class="bg-white w-full rounded-t-[2.5rem] p-6 pb-12 animate-slideUp">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-black text-xl italic">Sửa khoản chi</h3>
                            <button onclick="state.editingExpId=null; render();" class="text-slate-400 p-2">${icon.plus}</button>
                        </div>
                        <div class="space-y-4">
                            <input id="ed_res" type="text" value="${exp.reason}" class="w-full p-4 bg-slate-50 rounded-xl font-bold border-none outline-none">
                            <div class="grid grid-cols-2 gap-3">
                                <input id="ed_amt" type="number" inputmode="numeric" value="${exp.amount}" class="w-full p-4 bg-slate-50 rounded-xl font-black text-blue-600 border-none outline-none">
                                <select id="ed_pay" class="w-full p-4 bg-slate-50 rounded-xl font-bold border-none outline-none appearance-none">
                                    ${trip.families.map(f => `<option value="${f}" ${f===exp.payer?'selected':''}>${f}</option>`).join('')}
                                </select>
                            </div>
                            <input id="ed_time" type="datetime-local" value="${exp.time.slice(0,16)}" class="w-full p-4 bg-slate-50 rounded-xl font-bold text-slate-500 border-none outline-none">
                            <textarea id="ed_note" rows="2" class="w-full p-4 bg-slate-50 rounded-xl font-bold border-none outline-none resize-none">${exp.note || ''}</textarea>
                            <div class="flex gap-3 pt-4">
                                <button onclick="handleDelEx('${exp.id}')" class="bg-red-50 text-red-500 px-6 rounded-xl font-black">${icon.trash}</button>
                                <button onclick="handleSaveEdit()" class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-black shadow-lg">LƯU THAY ĐỔI</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function viewSummary(trip) {
            const total = trip.expenses.reduce((s,e) => s + e.amount, 0);
            const stats = trip.families.map(f => ({
                name: f, spent: trip.expenses.filter(e => e.payer === f).reduce((s,e) => s+e.amount, 0)
            }));
            const totalRatio = Object.values(trip.ratios || {}).reduce((s,v) => s + v, 0) || trip.families.length;
            const costUnit = total / totalRatio;

            return `
                <div class="p-6 pb-24 space-y-8 safe-top">
                    <div class="flex justify-between items-center">
                        <h2 class="text-3xl font-black italic">Tổng kết</h2>
                        ${trip.status !== 'completed' ? `<button onclick="handleFinish()" class="text-[10px] font-black uppercase bg-green-100 text-green-600 px-4 py-2 rounded-full">Chốt sổ</button>` : `<span class="text-[10px] font-black uppercase text-slate-300">Đã khóa</span>`}
                    </div>
                    <div class="bg-slate-900 text-white p-8 rounded-[3rem] text-center shadow-2xl">
                        <p class="text-4xl font-black tracking-tighter">${fmt(total)}</p>
                        <div class="grid grid-cols-2 gap-3 text-left mt-8">
                            ${stats.map((s, i) => `
                                <div class="bg-slate-800 p-3 rounded-2xl">
                                    <span class="text-[8px] font-black uppercase text-slate-500 block truncate">${s.name}</span>
                                    <p class="font-bold text-xs">${fmt(s.spent)}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="bg-white p-6 border rounded-[2.5rem] space-y-6">
                        <div class="space-y-4">
                            ${trip.families.map(f => `
                                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-2xl">
                                    <span class="font-bold">${f}</span>
                                    <div class="flex items-center gap-2">
                                        <input onchange="handleRat('${f}', this.value)" type="number" value="${trip.ratios[f] || 1}" class="w-16 p-2 rounded-xl text-center font-black text-blue-600 outline-none">
                                        <span class="text-[9px] font-black text-slate-300 uppercase">Phần</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="pt-6 border-t border-dashed space-y-3">
                            ${trip.families.map(f => {
                                const should = (trip.ratios[f] || 1) * costUnit;
                                const paid = stats.find(s => s.name === f).spent;
                                const diff = paid - should;
                                return `<div class="p-4 rounded-3xl flex justify-between items-center ${diff>=0?'bg-green-50':'bg-red-50'}">
                                    <div><p class="text-sm font-black">${f}</p><p class="text-[9px] font-bold text-slate-400 uppercase">Gánh: ${fmt(should)}</p></div>
                                    <div class="text-right"><p class="font-black text-lg ${diff>=0?'text-green-600':'text-red-600'}">${diff>=0?'+':''}${fmt(diff)}</p><p class="text-[9px] font-black uppercase opacity-40">${diff>=0?'Nhận về':'Nộp thêm'}</p></div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function viewNav() {
            return `
                <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-sm border-t flex justify-around py-4 px-6 z-40">
                    <button onclick="state.view='detail'; render();" class="flex flex-col items-center gap-1 ${state.view==='detail'?'text-blue-600':'text-slate-300'}">${icon.plus}<span class="text-[9px] font-black uppercase">Nhập tiền</span></button>
                    <button onclick="state.view='summary'; render();" class="flex flex-col items-center gap-1 ${state.view==='summary'?'text-blue-600':'text-slate-300'}">${icon.chart}<span class="text-[9px] font-black uppercase">Chia tiền</span></button>
                    <button onclick="state.view='home'; state.currentTripId=null; render();" class="flex flex-col items-center gap-1 text-slate-300">${icon.home}<span class="text-[9px] font-black uppercase">Thoát</span></button>
                </nav>
            `;
        }

        window.handleCreate = () => {
            const n = document.getElementById('in_name').value.trim();
            const f = document.getElementById('in_fams').value.split(',').map(x=>x.trim()).filter(x=>x);
            if (!n || f.length === 0) return alert('Nhập đủ tin!');
            const t = { id: Date.now().toString(), name: n, families: f, expenses: [], ratios: {} };
            f.forEach(x => t.ratios[x] = 1);
            state.trips.unshift(t); state.currentTripId = t.id; state.view = 'detail'; save();
        };

        window.handleAddEx = () => {
            const r = document.getElementById('ex_res').value.trim();
            const a = parseFloat(document.getElementById('ex_amt').value);
            const p = document.getElementById('ex_pay').value;
            const t = document.getElementById('ex_time').value;
            const n = document.getElementById('ex_note').value.trim();
            if (!r || isNaN(a)) return alert('Nhập lý do & tiền!');
            state.trips.find(x => x.id === state.currentTripId).expenses.unshift({ id: Date.now().toString(), reason: r, amount: a, payer: p, time: new Date(t).toISOString(), note: n });
            save();
        };

        window.handleSaveEdit = () => {
            const t = state.trips.find(x => x.id === state.currentTripId);
            const e = t.expenses.find(x => x.id === state.editingExpId);
            e.reason = document.getElementById('ed_res').value.trim();
            e.amount = parseFloat(document.getElementById('ed_amt').value);
            e.payer = document.getElementById('ed_pay').value;
            e.time = new Date(document.getElementById('ed_time').value).toISOString();
            e.note = document.getElementById('ed_note').value.trim();
            state.editingExpId = null;
            save();
        };

        window.handleSaveTripName = (newVal) => {
            if (newVal.trim()) state.trips.find(x => x.id === state.currentTripId).name = newVal.trim();
            state.isEditingTripName = false;
            save();
        };

        window.handleDelEx = (id) => { if(confirm('Xóa khoản này?')) { const t = state.trips.find(x => x.id === state.currentTripId); t.expenses = t.expenses.filter(e => e.id !== id); state.editingExpId = null; save(); } };
        window.handleDelTrip = (id) => { if(confirm('Xóa hết dữ liệu chuyến này?')) { state.trips = state.trips.filter(t => t.id !== id); state.currentTripId = null; state.view = 'home'; save(); } };
        window.handleRat = (f, v) => { state.trips.find(x => x.id === state.currentTripId).ratios[f] = parseFloat(v) || 0; save(); };
        window.handleFinish = () => { if(confirm('Chốt sổ và khóa dữ liệu?')) { state.trips.find(x => x.id === state.currentTripId).status = 'completed'; save(); } };

        render();
    </script>
</body>
</html>
